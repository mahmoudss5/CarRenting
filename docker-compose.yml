services:

  # ─── SQL Server ────────────────────────────────────────────────────────────
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # ─── .NET 10 Web API ───────────────────────────────────────────────────────
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: backend
    working_dir: /app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=CarRentalDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    volumes:
      - ./backEnd:/app
      - backend_nuget:/root/.nuget/packages
    command: ["dotnet", "watch", "run", "--urls", "http://+:8080", "--non-interactive"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  # ─── React Frontend ────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ia-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:5173"
    volumes:
      - ./frontEnd:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  sqlserver_data:
  backend_nuget:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
